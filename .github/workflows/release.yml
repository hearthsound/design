name: Release

# Publishes a tagged version to npm through Trusted Publishing (GitHub OIDC; no
# stored token) and creates the GitHub release from the CHANGELOG section.
# A version that already exists on npm (0.1.0 was published by hand, because
# npm only lets Trusted Publishing be configured on an existing package) is
# not published again; the GitHub release is still created.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Check the tag against package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@hearthsound/design@${version}" version >/dev/null 2>&1; then
            echo "@hearthsound/design@${version} is already on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file notes.md
