<h2 class="hs-title-4">k23 Segmented control</h2>
<p class="hs-caption">Selected and unselected are the only tab states; hover and keyboard focus use the shared treatments. One tab stop, Left/Right move and select.</p>

<h3 class="hs-heading">Now playing switch</h3>
<div class="hs-segmented" role="tablist" aria-label="Now playing">
  <button class="hs-segmented__tab hs-segmented__tab--selected" type="button" role="tab" aria-selected="true">Lyrics</button>
  <button class="hs-segmented__tab" type="button" role="tab" aria-selected="false">Queue</button>
</div>

<div class="hs-segmented" role="tablist" aria-label="Now playing">
  <button class="hs-segmented__tab" type="button" role="tab" aria-selected="false">Lyrics</button>
  <button class="hs-segmented__tab hs-segmented__tab--selected" type="button" role="tab" aria-selected="true">Queue</button>
</div>

<h3 class="hs-heading">Flush variant</h3>
<div class="hs-segmented hs-segmented--flush" role="tablist" aria-label="Now playing">
  <button class="hs-segmented__tab hs-segmented__tab--selected" type="button" role="tab" aria-selected="true">Lyrics</button>
  <button class="hs-segmented__tab" type="button" role="tab" aria-selected="false">Queue</button>
</div>

<h3 class="hs-heading">Overflow on a narrow row</h3>
<div style="width:280px">
  <div class="hs-segmented" role="tablist" aria-label="Admin plugins">
    <button class="hs-segmented__tab hs-segmented__tab--selected" type="button" role="tab" aria-selected="true">Installed</button>
    <button class="hs-segmented__tab" type="button" role="tab" aria-selected="false">Available</button>
    <button class="hs-segmented__tab" type="button" role="tab" aria-selected="false">Repositories</button>
  </div>
</div>
